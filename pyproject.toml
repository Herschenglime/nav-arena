[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nav_arena"
version = "0.1.0"
description = "A lightweight autonomous navigation evaluation framework for Isaac Sim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["nav_arena*"]

[tool.pytest.ini_options]
addopts = "-p no:launch_ros -p no:launch-testing-ros -p no:launch_testing"
testpaths = ["tests/unit"]
markers = [
    "unit: Fast L1 CPU unit tests without simulation or Kit dependency.",
    "ros2: L2 in-memory and subprocess ROS 2 middleware and node tests.",
    "integration: L3 end-to-end simulation integration tests run in isolated subprocesses.",
]


