name = "nav_arena"
version = "0.1.0"
description = "A lightweight autonomous navigation evaluation framework for Isaac Sim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["nav_arena*"]
